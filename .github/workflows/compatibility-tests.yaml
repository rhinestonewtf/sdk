name: Compatibility Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ["node-cjs", "node-esm", "react-native"]

    steps:
      # Setup and Build
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install

      - name: Build SDK
        run: bun run build

      # Package SDK for Testing
      - name: Pack SDK
        working-directory: src
        run: bunx npm pack --pack-destination $GITHUB_WORKSPACE/

      # Run package compatibility smoke tests
      - name: Test ${{ matrix.environment }} package compatibility
        run: ./.github/scripts/test-${{ matrix.environment }}.sh
