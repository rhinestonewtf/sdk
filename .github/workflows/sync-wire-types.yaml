# Keeps src/clients/orchestrator/wire.gen.ts in sync with the published
# orchestrator OpenAPI document. The per-PR CI check regenerates against the
# source `scripts/generate-wire-types.ts` resolves — today the snapshot vendored
# under scripts/openapi/, verified against its provenance manifest.
#
# `2026-09.caucasus` is not in the orchestrator's published version set yet, so
# `openapi/main` carries no `orchestrator/caucasus.json`. Until it does, this
# workflow reports a clean no-op: it never falls back to Blanc, and never
# advances a pin to a file that does not exist. Once the document is published
# (RHI-7424), this workflow starts opening the rolling sync PR that switches the
# generator to the immutable public commit and regenerates.
name: Sync wire types

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-wire-types
  cancel-in-progress: true

jobs:
  sync:
    name: Sync the pinned OpenAPI document and open a PR
    # `schedule` only ever fires on the default branch, but this file also rides
    # the main -> release merge, so a manual dispatch from `release` would run
    # against release's tree and open a nonsense PR into `main`.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Mint rhinestone-automations token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: sdk

      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install the npm dependencies
        run: bun install --frozen-lockfile

      - name: Detect published Caucasus drift
        id: drift
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.apiVersion' scripts/openapi/provenance.json)
          NAME="${VERSION#*.}"
          LATEST=$(git ls-remote https://github.com/rhinestonewtf/openapi.git main | cut -f1)
          URL="https://raw.githubusercontent.com/rhinestonewtf/openapi/${LATEST}/orchestrator/${NAME}.json"
          echo "looking for: $URL"
          STATUS=$(curl -sSL -o published.json -w '%{http_code}' "$URL")
          if [ "$STATUS" != "200" ]; then
            # Not published yet. Leave the vendored source in place — falling
            # back to an older version would silently downgrade the wire.
            echo "orchestrator/${NAME}.json is not published yet (HTTP $STATUS); nothing to sync."
            rm -f published.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if cmp -s published.json scripts/openapi/"${NAME}".json; then
            echo "Published document matches the vendored snapshot; nothing to sync."
            rm -f published.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Regenerate wire types against the published document
        if: steps.drift.outputs.changed == 'true'
        env:
          NAME: ${{ steps.drift.outputs.name }}
          LATEST: ${{ steps.drift.outputs.latest }}
        run: |
          set -euo pipefail
          SHA=$(sha256sum published.json | cut -d' ' -f1)
          mv published.json scripts/openapi/"${NAME}".json
          # Provenance describes the bytes in the tree, so the source moves
          # with the hash: leaving the orchestrator commit behind would
          # attribute a published document to a revision it did not come from.
          jq --arg sha "$SHA" --arg commit "$LATEST" \
            '.sha256 = $sha
             | .upstream = { repository: "https://github.com/rhinestonewtf/openapi", commit: $commit }
             | .generatedBy = "rhinestonewtf/openapi: published orchestrator document"
             | .note = "Synced from the public OpenAPI repo by the Sync wire types workflow."' \
            scripts/openapi/provenance.json > provenance.tmp
          mv provenance.tmp scripts/openapi/provenance.json
          bun run generate:wire
          bun run typecheck

      - name: Open or update the sync PR
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LATEST: ${{ steps.drift.outputs.latest }}
        run: |
          set -euo pipefail
          BRANCH="automations/sync-wire-types"
          git config user.name "rhinestone-automations[bot]"
          git config user.email "rhinestone-automations[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add scripts/openapi src/clients/orchestrator/wire.gen.ts
          git commit -m "chore(orchestrator): sync wire types to openapi@${LATEST}"
          git push --force origin "$BRANCH"
          TITLE="chore(orchestrator): sync wire types"
          BODY="Updates the pinned orchestrator OpenAPI document to [\`${LATEST}\`](https://github.com/rhinestonewtf/openapi/commit/${LATEST}) and regenerates \`wire.gen.ts\`.

          Auto-generated by the \`Sync wire types\` workflow — the only source of changes to \`wire.gen.ts\`."
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi
