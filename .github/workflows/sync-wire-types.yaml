# Keeps src/clients/orchestrator/wire.gen.ts in sync with the published
# orchestrator OpenAPI spec. The per-PR CI check regenerates against the openapi
# commit pinned in .openapi-ref — deterministic and immune to openapi/main
# drift. This workflow is the ONLY thing that advances that pin: it bumps the
# pin to openapi/main HEAD, regenerates, typechecks, and opens/updates a rolling
# PR. If the regen fails typecheck (a breaking upstream change), the job fails
# and no PR is opened — the pin stays put, so open PRs keep building, and the
# red cron run is the signal for a human to adapt the adapter boundary.
name: Sync wire types

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-wire-types
  cancel-in-progress: true

jobs:
  sync:
    name: Bump the openapi pin and open a PR
    # `schedule` only ever fires on the default branch, but this file also rides
    # the main -> release merge, so a manual dispatch from `release` would bump
    # the pin against release's tree and open a nonsense PR into `main`.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Mint rhinestone-automations token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: sdk

      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install the npm dependencies
        run: bun install

      - name: Detect openapi drift
        id: drift
        run: |
          set -euo pipefail
          LATEST=$(git ls-remote https://github.com/rhinestonewtf/openapi.git main | cut -f1)
          PINNED=$(tr -d '[:space:]' < src/clients/orchestrator/.openapi-ref)
          echo "openapi/main HEAD: $LATEST"
          echo "pinned:            $PINNED"
          if [ "$LATEST" = "$PINNED" ]; then
            echo "No drift; nothing to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$LATEST" > src/clients/orchestrator/.openapi-ref
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate wire types
        if: steps.drift.outputs.changed == 'true'
        run: |
          bun run generate:wire
          bun run typecheck

      - name: Open or update the sync PR
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LATEST: ${{ steps.drift.outputs.latest }}
        run: |
          set -euo pipefail
          BRANCH="automations/sync-wire-types"
          git config user.name "rhinestone-automations[bot]"
          git config user.email "rhinestone-automations[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/clients/orchestrator/.openapi-ref src/clients/orchestrator/wire.gen.ts
          git commit -m "chore(orchestrator): sync wire types to openapi@${LATEST}"
          git push --force origin "$BRANCH"
          TITLE="chore(orchestrator): sync wire types"
          BODY="Bumps the pinned \`openapi\` commit to [\`${LATEST}\`](https://github.com/rhinestonewtf/openapi/commit/${LATEST}) and regenerates \`wire.gen.ts\`.

          Auto-generated by the \`Sync wire types\` workflow — the only source of changes to \`wire.gen.ts\`."
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi
