name: Release

# This maintenance line publishes only to v2-latest, never latest or dev.
# Publishes use OIDC; release PRs use the rhinestone-automations GitHub App.

on:
  push:
    branches:
      - v2

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install the npm dependencies
        run: bun install --frozen-lockfile

      - name: Clean
        run: bun run clean

      - name: Test all
        run: bun run test

      - name: Build all
        run: bun run build

      - name: Publint
        working-directory: src
        run: bunx publint

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/v2'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Use OIDC-capable npm
        run: sudo npm install -g npm@11

      - name: Install the npm dependencies
        run: bun install --frozen-lockfile

      - name: Verify maintenance release version
        run: |
          bun -e 'const { version } = await Bun.file("src/package.json").json(); if (!/^2\.\d+\.\d+$/.test(version)) throw new Error(`Expected a stable v2 version, got ${version}`)'

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          commit: "chore: release"
          title: "Release"
          publish: bun run changeset:release
          version: bun run changeset:version
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Label release PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr edit ${{ steps.changesets.outputs.pullRequestNumber }} --add-label ship
