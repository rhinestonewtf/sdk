name: Release

# Push to main publishes a snapshot (@dev tag); push to release or v1
# runs changesets/action to open a Release PR or publish to npm.
# Publishes use OIDC trusted publishing; release PRs are opened by the
# rhinestone-automations GitHub App.

on:
  push:
    branches:
      - main
      - release
      - v1

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-mode:
    name: Resolve release mode
    runs-on: ubuntu-latest
    outputs:
      has-changesets: ${{ steps.mode.outputs.has-changesets }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect unreleased changesets
        id: mode
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit | grep -q .; then
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: Build & Test
    needs: [release-mode]
    # release/v1 pushes with changesets only open or update a release PR. Their
    # code has already passed the target branch's required PR checks.
    if: github.ref == 'refs/heads/main' || needs.release-mode.outputs.has-changesets != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install the npm dependencies
        run: bun install --frozen-lockfile

      - name: Clean
        run: bun run clean

      - name: Test all
        run: bun run test

      - name: Build all
        run: bun run build

      - name: Publint
        working-directory: src
        run: bunx publint

  integration-tests:
    name: Integration Tests
    needs: [release-mode, build-and-test]
    if: needs.build-and-test.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: live-integration-tests
      cancel-in-progress: false
    env:
      INTEGRATION_FUNDER_PRIVATE_KEY: ${{ secrets.INTEGRATION_FUNDER_PRIVATE_KEY }}
      INTEGRATION_RHINESTONE_API_KEY: ${{ secrets.INTEGRATION_RHINESTONE_API_KEY }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run smoke integration tests
        if: github.ref == 'refs/heads/main'
        run: bun run test:integration:smoke -- --run

      - name: Run all integration tests
        if: github.ref == 'refs/heads/release'
        run: bun run test:integration -- --run

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [release-mode, build-and-test, integration-tests]
    if: >-
      always() &&
      needs.release-mode.result == 'success' &&
      (
        (github.ref != 'refs/heads/main' && needs.release-mode.outputs.has-changesets == 'true') ||
        (github.ref == 'refs/heads/v1' && needs.release-mode.outputs.has-changesets != 'true' && needs.build-and-test.result == 'success') ||
        ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release') && needs.build-and-test.result == 'success' && needs.integration-tests.result == 'success')
      )
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Use OIDC-capable npm
        if: github.ref == 'refs/heads/main' || needs.release-mode.outputs.has-changesets != 'true'
        run: sudo npm install -g npm@11

      - name: Install the npm dependencies
        run: bun install --frozen-lockfile

      # Snapshot publish (main → @dev)
      - name: Version snapshot
        if: github.ref == 'refs/heads/main'
        run: bunx changeset version --snapshot dev && bun run scripts/sync-version.ts

      - name: Build and publish snapshot
        if: github.ref == 'refs/heads/main'
        run: bun run build && bunx changeset publish --tag dev

      - name: Detect unreleased changesets
        if: github.ref == 'refs/heads/main'
        id: promotion
        run: |
          CHANGESETS=$(git diff --diff-filter=A --name-only origin/release...HEAD -- '.changeset/*.md' ':!.changeset/README.md')
          if [ -z "$CHANGESETS" ]; then
            echo "No unreleased changesets; skipping the release promotion PR."
            echo "releasable=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unreleased changesets:"
            echo "$CHANGESETS"
            echo "releasable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open release promotion PR
        if: github.ref == 'refs/heads/main' && steps.promotion.outputs.releasable == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          EXISTING_PR=$(gh pr list --base release --head main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Release promotion PR #${EXISTING_PR} is already open."
            exit 0
          fi

          gh pr create \
            --base release \
            --head main \
            --title "Release" \
            --body "Promotes releasable changes from \`main\` to \`release\` after a successful \`@dev\` publish." \
            --label ship

      # Beta/prod publish (release or v1 → Release PR or @latest)
      - name: Create Release Pull Request or Publish
        if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/v1'
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          commit: "chore: release"
          title: "Release"
          publish: bun run changeset:release
          version: bun run changeset:version
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Label release PR
        if: (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/v1') && steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr edit ${{ steps.changesets.outputs.pullRequestNumber }} --add-label ship
