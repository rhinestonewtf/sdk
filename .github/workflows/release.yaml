name: Release

# Push to main publishes a snapshot (@dev tag); push to release or v1
# runs changesets/action to open a Release PR or publish to npm. On this
# v1 line, publishes target the `v1` dist-tag so they don't move `latest`
# (which tracks the v2 line). Publishes use OIDC trusted publishing;
# release PRs are opened by the rhinestone-automations GitHub App.

on:
  push:
    branches:
      - main
      - release
      - v1

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0

      - name: Install the npm dependencies
        run: bun install

      - name: Clean
        run: bun run clean

      - name: Test all
        run: bun run test
        env:
          VITE_ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY}}

      - name: Build all
        run: bun run build

      - name: Publint
        working-directory: src
        run: bunx publint

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-and-test]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mint release-bot token
        if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/v1'
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Use OIDC-capable npm
        run: sudo npm install -g npm@11

      - name: Install the npm dependencies
        run: bun install --frozen-lockfile

      # Snapshot publish (main → @dev)
      - name: Version snapshot
        if: github.ref == 'refs/heads/main'
        run: bunx changeset version --snapshot dev && bun run scripts/sync-version.ts

      - name: Build and publish snapshot
        if: github.ref == 'refs/heads/main'
        run: bun run build && bunx changeset publish --tag dev

      # Beta/prod publish (release or v1 → Release PR or @latest)
      - name: Create Release Pull Request or Publish
        if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/v1'
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          commit: "chore: release"
          title: "Release"
          publish: bun run changeset:release
          version: bun run changeset:version
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Label release PR
        if: (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/v1') && steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr edit ${{ steps.changesets.outputs.pullRequestNumber }} --add-label ship
